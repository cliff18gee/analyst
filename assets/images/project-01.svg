    <text x="545" y="174" font-weight="700">4 Present to</text><text x="545" y="192" fill="#566070">clinicians</text>
    <text x="545" y="266" font-weight="700">5 Clinical</text><text x="545" y="284" fill="#566070">review</text>
    <text x="320" y="266" font-weight="700">6 Document</text><text x="320" y="284" fill="#566070">decisions</text>
    <text x="95" y="266" font-weight="700">7 Monitor</text><text x="95" y="284" fill="#566070">KPIs</text>
    <text x="320" y="190" font-size="15" fill="#1f5f6b" font-weight="700">Human-governed AI decision support</text>
  </g>
